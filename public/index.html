<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugBound — Change-Impact Analysis & Blast Radius Engine</title>
  <meta name="description" content="BugBound builds a static dependency graph of your application and calculates the ripple effect of schema and code changes before you deploy.">

  <!-- Google Fonts: Inter, JetBrains Mono, and Caveat (Handwritten) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Cytoscape.js & Chart.js from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Unified Application Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

  <!-- ==================== APP SHELL WRAPPER ==================== -->
  <div class="app-layout">

    <!-- ==================== 1. FIXED LEFT SIDEBAR (~220px) ==================== -->
    <aside class="app-sidebar" id="app-sidebar">
      <!-- Brand Logo & Tagline -->
      <div class="sidebar-brand">
        <a href="#/dashboard" class="brand-link">
          <div class="brand-glyph">⚡</div>
          <div class="brand-titles">
            <span class="brand-name">BugBound</span>
            <span class="brand-tagline">Change-Impact Intelligence</span>
          </div>
        </a>
      </div>

      <!-- Navigation Links with SVG Icons -->
      <nav class="sidebar-nav">
        <!-- 1. Dashboard -->
        <a href="#/dashboard" class="nav-item active" title="System Dashboard & Health">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="nav-label">Dashboard</span>
        </a>

        <!-- 2. Graph Explorer -->
        <a href="#/graph" class="nav-item" title="Cytoscape Topology Visualizer">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span class="nav-label">Graph Explorer</span>
        </a>

        <!-- 3. What-If Simulator -->
        <a href="#/simulate" class="nav-item" title="Propose Schema & Code Changes">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span class="nav-label">What-If Simulator</span>
        </a>

        <!-- 4. Chain Reaction -->
        <a href="#/chain" class="nav-item" title="Cascading Propagation Flow">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span class="nav-label">Chain Reaction</span>
        </a>

        <!-- 5. Blast Radius -->
        <a href="#/blast" class="nav-item" title="Whiteboard Hand-Drawn Sketch">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
          <span class="nav-label">Blast Radius</span>
        </a>

        <!-- 6. History & Compare -->
        <a href="#/history" class="nav-item" title="Audit Runs & Side-by-Side Diff">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="nav-label">History & Compare</span>
        </a>

        <!-- 7. Analytics -->
        <a href="#/analytics" class="nav-item" title="Risk Analytics & Hotspots">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span class="nav-label">Analytics</span>
        </a>

        <!-- 8. Live Events -->
        <a href="#/events" class="nav-item" title="Real-Time Audit SSE Feed">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
            <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
            <circle cx="12" cy="12" r="2"></circle>
            <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
            <path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"></path>
          </svg>
          <span class="nav-label">Live Events</span>
        </a>

        <!-- 9. Code Scanner -->
        <a href="#/scanner" class="nav-item" title="Heuristic AST/Regex Pattern Scanner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="nav-label">Code Scanner</span>
        </a>

        <!-- 10. How It Works -->
        <a href="#/about" class="nav-item" title="Architecture & Judge Guide">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span class="nav-label">How It Works</span>
        </a>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <span class="footer-version-text text-mono">BugBound v1.0 • MongoDB</span>
      </div>
    </aside>

    <!-- ==================== MAIN COLUMN (TOPBAR + CONTENT) ==================== -->
    <div class="app-main-column">

      <!-- ==================== TOP BAR ==================== -->
      <header class="top-bar">
        <div class="top-bar-left">
          <!-- Mobile Toggle -->
          <button id="btn-mobile-sidebar-toggle" class="btn btn-ghost btn-icon mobile-only" title="Toggle Sidebar">
            ☰
          </button>

          <!-- Project Selector -->
          <div class="top-control-group">
            <label class="top-label">Project:</label>
            <select id="topbar-project-select" class="select-compact text-mono">
              <option value="">Select Project...</option>
            </select>
            <button id="btn-topbar-new-project" class="btn btn-ghost btn-xs" title="Create New Project">+ New</button>
          </div>

          <!-- Version Selector -->
          <div class="top-control-group">
            <label class="top-label">Version:</label>
            <select id="topbar-version-select" class="select-compact text-mono">
              <option value="">Select Version...</option>
            </select>
          </div>
        </div>

        <div class="top-bar-right">
          <!-- Load ShopLite Demo (Glowing Green) -->
          <button id="btn-topbar-seed" class="btn btn-glowing-green" title="One-click load ShopLite Demo">
            <span>⚡</span> Load ShopLite
          </button>

          <!-- Current Simulation Chip -->
          <div id="topbar-sim-chip" class="topbar-sim-chip" style="display: none;" title="Click to view Chain Reaction">
            <!-- Dynamically populated -->
          </div>

          <!-- Connection Status Indicators -->
          <div id="topbar-db-status" class="top-status-indicator" title="MongoDB Connection Status">
            <span class="indicator-dot yellow"></span>
            <span>Atlas</span>
          </div>

          <div id="topbar-sse-status" class="top-status-indicator" title="SSE Audit Feed Status">
            <span class="indicator-dot green"></span>
            <span>Live</span>
          </div>
        </div>
      </header>

      <!-- ==================== MAIN CONTENT AREA (ROUTED PAGES) ==================== -->
      <main id="main-content" class="main-content">
        <!-- Rendered by Router -->
      </main>

    </div>

  </div>

  <!-- ==================== GLOBAL MODALS ==================== -->

  <!-- Modal: Create New Project -->
  <div id="modal-new-project" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header-row">
        <h3>Create New Project</h3>
        <button id="btn-close-new-project" class="close-x-btn">×</button>
      </div>
      <div class="form-field">
        <label class="form-label">Project Name</label>
        <input type="text" id="input-new-project-name" class="form-input" placeholder="e.g. PaymentsGateway">
      </div>
      <div class="modal-actions-row">
        <button id="btn-cancel-new-project" class="btn btn-ghost">Cancel</button>
        <button id="btn-submit-new-project" class="btn btn-glowing-green">Create Project</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/graph.js"></script>
  <script src="js/pages/simulate.js"></script>
  <script src="js/pages/chain.js"></script>
  <script src="js/pages/blast.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/events.js"></script>
  <script src="js/pages/scanner.js"></script>
  <script src="js/pages/about.js"></script>
  <script src="app.js"></script>
</body>
</html>
